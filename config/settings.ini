[DEFAULT]
# Trading Parameters
symbol = BTC/USDT
spread_entry = 50        ; Minimum price difference to enter trade (absolute $)
spread_exit = 10         ; Spread target to exit trade
amount = 0.01            ; Size per leg (e.g., 0.01 BTC)
poll_interval = 2        ; Seconds between price checks
max_hold_time = 300      ; Max seconds to hold positions
slippage_tolerance = 0.2 ; % max slippage tolerated
log_level = INFO
use_dry_run = True       ; Set to False to place real orders

# Binance API
binance_api_key = your_binance_api_key
binance_api_secret = your_binance_api_secret

# Bybit API
bybit_api_key = your_bybit_api_key
bybit_api_secret = your_bybit_api_secret
